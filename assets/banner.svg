<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 680" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      
      .title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: -2.5px;
      }
      .subtitle {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        letter-spacing: -0.4px;
      }
    </style>
    
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041214"/>
      <stop offset="50%" stop-color="#0a262a"/>
      <stop offset="100%" stop-color="#020a0b"/>
    </linearGradient>
    
    <radialGradient id="bg-glow-left" cx="560" cy="340" r="650" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#0a262a" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#041214" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bg-glow-right" cx="1650" cy="340" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#041214" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#041214" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Title Gradient: White through Teal to Green -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#e6fffa"/>
      <stop offset="70%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- Prescription Paper Styling -->
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fbfaf6"/>
      <stop offset="100%" stop-color="#edf2ea"/>
    </linearGradient>

    <filter id="paper-shadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#021619" flood-opacity="0.35"/>
    </filter>

    <!-- Stamp Traffic Light Housing -->
    <linearGradient id="ampel-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092f33"/>
      <stop offset="50%" stop-color="#041d20"/>
      <stop offset="100%" stop-color="#020f11"/>
    </linearGradient>

    <filter id="ampel-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Red Light (Dark / Matt) -->
    <linearGradient id="red-dark-grad" x1="30%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#4c1414"/>
      <stop offset="60%" stop-color="#300d0d"/>
      <stop offset="100%" stop-color="#1a0606"/>
    </linearGradient>

    <!-- Yellow Light (Dark / Matt) -->
    <linearGradient id="yellow-dark-grad" x1="30%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#4a2c06"/>
      <stop offset="60%" stop-color="#2e1a03"/>
      <stop offset="100%" stop-color="#170c01"/>
    </linearGradient>

    <!-- Green Light (Active Radiant Glow) -->
    <linearGradient id="green-lens-grad" x1="30%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="35%" stop-color="#4ade80"/>
      <stop offset="75%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Radial Glows for Green Light -->
    <radialGradient id="green-glow-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.55"/>
      <stop offset="25%" stop-color="#22c55e" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#14b8a6" stop-opacity="0.16"/>
      <stop offset="85%" stop-color="#041214" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#041214" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="green-glow-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#86efac" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#22c55e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>

    <filter id="green-bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="28" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid-dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#14b8a6" fill-opacity="0.12"/>
    </pattern>
  </defs>
  
  <!-- Main Background Canvas -->
  <rect width="2400" height="680" fill="url(#bg)"/>
  <rect width="2400" height="680" fill="url(#grid-dots)"/>
  <rect width="2400" height="680" fill="url(#bg-glow-left)"/>
  <rect width="2400" height="680" fill="url(#bg-glow-right)"/>
  
  <!-- Subtle Framing Border -->
  <rect x="1.5" y="1.5" width="2397" height="677" fill="none" stroke="#14b8a6" stroke-width="2" stroke-opacity="0.25"/>

  <!-- ======================================================== -->
  <!-- LEFT: MEDICAL PRESCRIPTION FORM (REZEPTFORMULAR)         -->
  <!-- ======================================================== -->
  <g transform="rotate(-3.2 540 340)">
    <!-- Paper Sheet with Deep Shadow -->
    <rect x="150" y="85" width="780" height="510" rx="16" fill="url(#paper-grad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#paper-shadow)"/>
    
    <!-- Header Color Band / Security Line -->
    <path d="M 150 115 L 930 115" stroke="#14b8a6" stroke-width="3" stroke-opacity="0.25"/>

    <!-- Medical Symbol: Stylized Clinical Cross -->
    <rect x="182" y="132" width="28" height="28" rx="6" fill="#0f766e" opacity="0.85"/>
    <path d="M 196 138 L 196 154 M 188 146 L 204 146" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Patient / Insurance Data Box (Generisches Formularfeld) -->
    <rect x="224" y="130" width="456" height="96" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="224" y1="162" x2="680" y2="162" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="224" y1="192" x2="680" y2="192" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Pseudotext Bars: Insurance & Patient Data -->
    <rect x="238" y="143" width="130" height="8" rx="4" fill="#94a3b8" opacity="0.75"/>
    <rect x="420" y="144" width="85" height="7" rx="3.5" fill="#cbd5e1"/>
    
    <rect x="238" y="172" width="220" height="9" rx="4.5" fill="#64748b" opacity="0.85"/>
    <rect x="480" y="173" width="95" height="7" rx="3.5" fill="#94a3b8" opacity="0.6"/>
    
    <rect x="238" y="202" width="70" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="328" y="202" width="90" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="438" y="202" width="80" height="7" rx="3.5" fill="#cbd5e1"/>

    <!-- Status & Fee Checkboxes (Right Header Field) -->
    <rect x="696" y="130" width="204" height="96" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <rect x="712" y="140" width="14" height="14" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="736" y="144" width="75" height="6" rx="3" fill="#94a3b8" opacity="0.75"/>
    
    <rect x="712" y="171" width="14" height="14" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="736" y="175" width="95" height="6" rx="3" fill="#94a3b8" opacity="0.75"/>
    
    <rect x="712" y="200" width="14" height="14" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="736" y="204" width="60" height="6" rx="3" fill="#94a3b8" opacity="0.75"/>

    <!-- Prescription Body: "Rp." Header -->
    <text x="182" y="268" font-family="'Outfit', sans-serif" font-weight="800" font-size="24" fill="#64748b" opacity="0.75">Rp.</text>

    <!-- Verordnungszeile 1 -->
    <rect x="224" y="255" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="254" y="257" width="370" height="13" rx="4" fill="#475569" opacity="0.85"/>
    <rect x="644" y="258" width="105" height="11" rx="3.5" fill="#64748b" opacity="0.75"/>
    <rect x="768" y="258" width="65" height="11" rx="3.5" fill="#94a3b8" opacity="0.65"/>
    <line x1="224" y1="288" x2="900" y2="288" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Verordnungszeile 2 -->
    <rect x="224" y="312" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="254" y="314" width="320" height="13" rx="4" fill="#475569" opacity="0.85"/>
    <rect x="594" y="315" width="125" height="11" rx="3.5" fill="#64748b" opacity="0.75"/>
    <rect x="738" y="315" width="55" height="11" rx="3.5" fill="#94a3b8" opacity="0.65"/>
    <line x1="224" y1="345" x2="900" y2="345" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Verordnungszeile 3 -->
    <rect x="224" y="369" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="254" y="371" width="350" height="13" rx="4" fill="#64748b" opacity="0.8"/>
    <rect x="624" y="372" width="95" height="11" rx="3.5" fill="#94a3b8" opacity="0.7"/>
    <rect x="738" y="372" width="70" height="11" rx="3.5" fill="#cbd5e1"/>
    <line x1="224" y1="402" x2="900" y2="402" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Footer: Date Box -->
    <rect x="182" y="432" width="226" height="92" rx="6" fill="#ffffff" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="198" y="448" width="65" height="7" rx="3.5" fill="#94a3b8" opacity="0.7"/>
    <rect x="198" y="474" width="115" height="9" rx="4.5" fill="#64748b" opacity="0.8"/>

    <!-- Footer: Doctor Signature & Approval Box -->
    <rect x="566" y="426" width="334" height="126" rx="6" fill="#ffffff" fill-opacity="0.8" stroke="#cbd5e1" stroke-dasharray="4 4" stroke-width="1.2"/>
    <rect x="584" y="442" width="125" height="7" rx="3.5" fill="#94a3b8" opacity="0.6"/>
    <!-- Stylized Doctor Signature -->
    <path d="M 610 505 Q 640 470 670 500 T 730 490 T 795 482 T 855 476" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- ======================================================== -->
  <!-- CENTER-LEFT: ROUND TRAFFIC LIGHT STAMP (STEMPELAMPEL)    -->
  <!-- Stamped freshly across the prescription, slightly angled -->
  <!-- ======================================================== -->
  <g transform="rotate(7.5 610 345)">
    <!-- Broad Radiant Green Glow onto Paper & Scene -->
    <circle cx="610" cy="425" r="280" fill="url(#green-glow-ambient)"/>
    
    <!-- Outer Circular Stamp Ring -->
    <circle cx="610" cy="345" r="182" fill="#14b8a6" fill-opacity="0.03" stroke="#14b8a6" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Inner Concentric Stamp Ring -->
    <circle cx="610" cy="345" r="168" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-dasharray="320 6 80 4 140 5"/>
    
    <!-- Stamp Verification Marks / Dots Ring -->
    <circle cx="610" cy="345" r="175" fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="2 12" opacity="0.65"/>
    
    <!-- Inner Boundary Ring -->
    <circle cx="610" cy="345" r="152" fill="none" stroke="#0d9488" stroke-width="1.2" opacity="0.5"/>

    <!-- Ampel Capsule Body (Traffic Light Housing) -->
    <rect x="548" y="218" width="124" height="254" rx="44" fill="url(#ampel-body-grad)" stroke="#2dd4bf" stroke-width="3" filter="url(#ampel-shadow)"/>
    <rect x="555" y="225" width="110" height="240" rx="38" fill="none" stroke="#14b8a6" stroke-width="1.2" opacity="0.45"/>

    <!-- Light Hoods / Visors -->
    <path d="M 580 262 A 30 30 0 0 1 640 262" fill="none" stroke="#14b8a6" stroke-width="2.5" opacity="0.4"/>
    <path d="M 580 338 A 30 30 0 0 1 640 338" fill="none" stroke="#14b8a6" stroke-width="2.5" opacity="0.4"/>
    <path d="M 580 414 A 30 30 0 0 1 640 414" fill="none" stroke="#2dd4bf" stroke-width="2.5" opacity="0.8"/>

    <!-- 1. RED LIGHT (Top) - Dark / Matt, No Glow -->
    <circle cx="610" cy="265" r="31" fill="#180b0b" stroke="#451414" stroke-width="2"/>
    <circle cx="610" cy="265" r="27" fill="url(#red-dark-grad)"/>
    <path d="M 589 265 A 21 21 0 0 1 631 265" fill="none" stroke="#7f1d1d" stroke-width="1.2" opacity="0.25"/>

    <!-- 2. YELLOW LIGHT (Middle) - Dark / Matt, No Glow -->
    <circle cx="610" cy="345" r="31" fill="#161204" stroke="#452306" stroke-width="2"/>
    <circle cx="610" cy="345" r="27" fill="url(#yellow-dark-grad)"/>
    <path d="M 589 345 A 21 21 0 0 1 631 345" fill="none" stroke="#854d0e" stroke-width="1.2" opacity="0.25"/>

    <!-- 3. GREEN LIGHT (Bottom) - BRILLIANT ACTIVE GLOW -->
    <!-- Green Bloom Halo -->
    <circle cx="610" cy="425" r="62" fill="#22c55e" opacity="0.5" filter="url(#green-bloom)"/>
    <circle cx="610" cy="425" r="42" fill="#4ade80" opacity="0.75" filter="url(#green-bloom)"/>
    
    <!-- Outer Bezel Ring -->
    <circle cx="610" cy="425" r="32" fill="#042f2e" stroke="#86efac" stroke-width="2.5"/>
    
    <!-- Lens Base -->
    <circle cx="610" cy="425" r="27" fill="url(#green-lens-grad)"/>
    
    <!-- Concentrated Core Glow -->
    <circle cx="610" cy="425" r="27" fill="url(#green-glow-core)"/>
    
    <!-- White-Hot Center -->
    <circle cx="610" cy="425" r="11" fill="#ffffff" opacity="0.95"/>
    
    <!-- Specular Highlight -->
    <ellipse cx="604" cy="418" rx="5.5" ry="3" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT: WORDMARK & SUBTITLE                               -->
  <!-- ======================================================== -->
  <g transform="translate(1090, 0)">
    <!-- Wortmarke: "verordnungsampel" (Kleinschreibung laut Brief) -->
    <text x="0" y="340" class="title" font-size="124" fill="url(#title-grad)">verordnungsampel</text>
    
    <!-- Kurze Zeile aus README -->
    <text x="6" y="420" class="subtitle" font-size="44" fill="#ccfbf1">Verordnungen prüfen, Risiko auf einen Blick</text>
  </g>

</svg>
